name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-solid-sdk:
    name: Solid SDK dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Solid SDK versions
        working-directory: web
        run: node ../scripts/check_solid_sdk_versions.mjs
      - name: Upload SDK check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solid-sdk-check-report
          path: artifacts/solid-sdk-check.json
          if-no-files-found: ignore

  web-tests:
    name: Frontend unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Lint (no-undef net)
        working-directory: web
        run: npm run lint
      - name: Run vitest
        working-directory: web
        run: npm test

  test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check-solid-sdk
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        working-directory: proxion-messenger-core
        run: pip install -e ".[gateway,cli,test]"

      - name: Cold-path undefined-name gate (H1)
        run: python scripts/check_cold_paths.py

      - name: Run unit tests
        working-directory: proxion-messenger-core
        run: pytest tests/ -q --tb=short -m "not integration"

  build-sidecar:
    name: Build sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pyinstaller && pip install -e "./proxion-messenger-core[gateway]"

      - name: Build sidecar
        run: python build_sidecar.py

      - name: Verify binary exists (Linux/macOS)
        if: runner.os != 'Windows'
        run: ls tauri-app/src-tauri/sidecar/proxion-gateway-*

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        run: Get-ChildItem tauri-app\src-tauri\sidecar\proxion-gateway-*.exe
        shell: pwsh

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxion-gateway-${{ matrix.os }}
          path: tauri-app/src-tauri/sidecar/proxion-gateway-*
          if-no-files-found: error

  jss-integration:
    # Runs the JSS (JavaScript Solid Server) live-integration test against a real JSS,
    # so the gateway's JSS path is verified on every change. JSS ships as an npm package
    # (no official Docker image), so it is started as a background step rather than a
    # `services:` container. Pinned to a known-good version; bump deliberately.
    name: JSS integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22 (JSS requires Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JSS (pinned)
        run: npm install -g javascript-solid-server@0.0.220

      - name: Start JSS and wait for readiness
        run: |
          nohup jss start --port 4455 --idp > jss.log 2>&1 &
          echo "Waiting for JSS on :4455 ..."
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:4455/; then
              echo "JSS up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "JSS did not become ready in time"; cat jss.log; exit 1

      - name: Install core deps
        working-directory: proxion-messenger-core
        run: pip install -e ".[gateway,test]"

      - name: Run JSS live integration test
        working-directory: proxion-messenger-core
        env:
          PROXION_JSS_URL: http://127.0.0.1:4455
        run: pytest tests/test_jss_setup.py -m integration -q --tb=short

      - name: Dump JSS log on failure
        if: failure()
        run: cat jss.log || true

  reproducible-check:
    # Informational (E4): builds the sidecar twice and reports how reproducible
    # it is. Non-blocking (continue-on-error) until the sidecar is reliably
    # bit-for-bit identical; flip to a hard gate once it is. See docs/VERIFYING.md.
    name: Reproducible build check
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the commit for SOURCE_DATE_EPOCH

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build deps
        run: pip install pyinstaller && pip install -e "./proxion-messenger-core[gateway]"

      - name: Build twice and compare
        run: python scripts/check_reproducible.py | tee reproducible-report.txt

      - name: Publish report to the run summary
        if: always()
        run: |
          {
            echo '### Reproducible build report'
            echo '```'
            cat reproducible-report.txt || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
